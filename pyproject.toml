[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-electrical"
dynamic = ["version"]
description = "AIPE Electrical Design: analytical converter models with explicit SI units (lossless SPS dual-active-bridge analysis, CCM DC-DC sizing, first-order losses)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fulong Li" }]
keywords = ["power electronics", "dual active bridge", "DAB", "single phase shift", "DC-DC", "converter design", "AIPE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
# Standard library only at runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/FulongLi/AIPE-Electrical-Design"
Changelog = "https://github.com/FulongLi/AIPE-Electrical-Design/blob/main/CHANGELOG.md"

[project.scripts]
aipe-electrical = "aipe_electrical.interfaces.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aipe_electrical.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["aipe_electrical*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
