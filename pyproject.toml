[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pea"
version = "0.1.0"
description = "AIPE Design Agent - Power engineering design and orchestration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fulong Li" }]
keywords = ["power electronics", "AI", "DC-DC", "converter design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.20",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.29.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
orchestration = ["jsonschema[format]>=4.25,<5"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
desktop = ["pywebview>=5.0"]
optimize = ["pymoo>=0.6.1", "numpy>=1.24", "pandas>=2.0"]
cad = ["cadquery>=2.4"]

[project.scripts]
pea = "pea.cli:run_cli"
pea-desktop = "pea.desktop:main"

[tool.setuptools.packages.find]
include = ["pea*"]
